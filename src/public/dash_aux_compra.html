<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard</title>
    <link rel="shortcut icon" href="/assets/icons/favicon.ico" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/dash_almacen/products.css" />
    <!-- Boxicons CDN Link -->
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link href="https://unpkg.com/tabulator-tables@6.2.5/dist/css/tabulator_midnight.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/tabulator-tables@6.2.5/dist/js/tabulator.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
    <script src="/js/dashboard.js" defer></script>
    <script type="module" src="/js/dash_compra/suppliers.js" defer></script>
  </head>
  <body>
    <div class="sidebar">
      <div class="logo-details">
        <img src="/assets/images/logo.jpg" class="logo"></img>
        <div class="logo_name">PlastiTex</div>
        <i class="fi fi-rr-menu-burger" id="btn"></i>
      </div>
      <ul class="nav-list">
        <li>
          <a id="btn-library" href="#">
            <i class="fi fi-rr-supplier-alt"></i>
            <span class="links_name">Proveedor</span>
          </a>
          <span class="tooltip">Proveedor</span>
        </li>
        <li>
          <a href="#products-section">
            <i class="fi fi-rr-boxes"></i>
            <span class="links_name">Productos - Stock</span>
          </a>
          <span class="tooltip">Productos - Stock</span>
        </li>
        <li>
          <a href="#history-section">
            <i class="fi fi-rr-files-medical"></i>
            <span class="links_name">Historial - Compras</span>
          </a>
          <span class="tooltip">Historial - Compras</span>
        </li>
        <li>
          <a href="#orden-section">
            <i class="fi fi-rr-arrow-progress"></i>
            <span class="links_name">Orden - Compra</span>
          </a>
          <span class="tooltip">Orden - Compra</span>
        </li>
        <li class="profile">
        <li class="profile">
          <div class="profile-details">
            <img src="profile.jpg" alt="profileImg" />
            <div class="name_job">
              <div id="user" class="name"></div>
            </div>
          </div>
          <i class="fi fi-rr-sign-out-alt" id="log_out"></i>
        </li>
      </ul>
    </div>
    <!-- Library section-->
    <section id="supplier-section" class="home-section">
      <div class="section-header">
        <h2>Gestión de Proveedores</h2>
        <button id="btn-add-product" class="btn-primary">+ Nuevo Proveedor</button>
      </div>

      <div class="search-box">
        <input type="text" id="supplier-search" class="search-input" placeholder="Buscar proveedor..." />
      </div>

      <div id="supplier-table" class="data-table"></div>

      <div id="supplier-modal" class="modal">
        <div class="modal-content">
          <h3 id="modal-title">Nuevo Proveedor</h3>

          <form id="supplier-form">
            <input type="hidden" id="supplier-id">

            <div class="form-group">
              <label>Nombre</label>
              <input type="text" id="supplier-name" required>
            </div>

            <div class="form-group">
              <label>Número</label>
              <input type="text" id="supplier-phone" required>
            </div>

            <div class="form-group">
              <label>Dirección</label>
              <input type="text"  id="supplier-address" required>
            </div>

            <div class="modal-actions">
              <button type="button" id="btn-cancel" class="btn-secondary">Cancelar</button>
              <button type="submit" class="btn-primary">Guardar</button>
            </div>
          </form>
        </div>
      </div>
    </section>
    <!-- Explorer section-->
    <section id="products-section" class="home-section">
    </section>
    <!-- About us section-->
    <section id="history-section" class="home-section"></section>
    <section id="orden-section" class="home-section"></section>

    <script src="/js/dashboard/library-utils.js" ></script>
  </body>
</html>
